# Deploy automatico su S3 + CloudFront.
#
# Si attiva a ogni push su main (incluse le modifiche fatte con la
# matita su GitHub.com, es. blog-posts.json o plans.json) e può essere
# lanciato a mano dalla tab Actions (workflow_dispatch).
#
# Nessuna chiave AWS statica: il job assume un ruolo temporaneo con OIDC
# (ruolo heliox-github-landing, definito in Terraform nel progetto HeleoX).
# Il ruolo si fida solo di questo repository e solo del ramo main, e può
# solo sincronizzare il bucket del sito e invalidare la sua distribuzione.
#
# Richiede questi Secrets (Settings → Secrets and variables → Actions):
#   S3_BUCKET                  — nome del bucket (senza s3://)
#   CLOUDFRONT_DISTRIBUTION_ID — es. E1ABC23DEF456
# Non servono più AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY e AWS_REGION.

name: Deploy su S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # Prima, il controllo dei segreti e dei dati (segreti-dati.yml): se fallisce, il sito non si pubblica.
  segreti-dati:
    uses: ./.github/workflows/segreti-dati.yml
    permissions:
      contents: read

  deploy:
    needs: segreti-dati
    runs-on: ubuntu-latest
    # id-token: write serve a GitHub per emettere il token OIDC che AWS
    # scambia con le credenziali temporanee del ruolo.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Assumi il ruolo AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::790304250429:role/heliox-github-landing
          aws-region: eu-west-1

      # Asset (CSS, JS, immagini): cache di un giorno nel browser.
      # HTML e JSON vengono ricaricati al passo successivo con no-cache,
      # così notizie e prezzi nuovi sono visibili subito.
      - name: Sync dei file sul bucket
        run: |
          aws s3 sync . "s3://${{ secrets.S3_BUCKET }}" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "docs/*" \
            --exclude "README.md" \
            --cache-control "public, max-age=86400" \
            --delete

      - name: HTML e JSON senza cache
        run: |
          aws s3 cp . "s3://${{ secrets.S3_BUCKET }}" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "docs/*" \
            --cache-control "no-cache"

      - name: Invalidazione della cache CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
